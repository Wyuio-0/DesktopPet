name: AmiyaPet
options:
  bundleIdPrefix: com.amiya
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
targets:
  AmiyaPet:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: AmiyaPet/App
      - path: AmiyaPet/Core
      - path: AmiyaPet/UI
      - path: AmiyaPet/Resources
    info:
      path: AmiyaPet/Resources/Info.plist
    dependencies:
      - target: AmiyaWidgets
    settings:
      base:
        PRODUCT_NAME: AmiyaPet
        PRODUCT_BUNDLE_IDENTIFIER: com.amiya.pet
        MARKETING_VERSION: "1.9.3"
        CURRENT_PROJECT_VERSION: "213"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual

  AmiyaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: AmiyaPet/Widgets
      - path: AmiyaPet/Core/Schedule/Course.swift
      - path: AmiyaPet/Core/Schedule/ScheduleAdjustment.swift
      - path: AmiyaPet/Core/Schedule/ScheduleManager.swift
      - path: AmiyaPet/Core/Focus/PomodoroTimer.swift
      - path: AmiyaPet/Core/Notifications/LiveActivityManager.swift
      - path: AmiyaPet/UI/Main/AmiyaTheme.swift
      - path: AmiyaPet/Resources/Assets.xcassets
    info:
      path: AmiyaPet/Widgets/Info.plist
    settings:
      base:
        PRODUCT_NAME: AmiyaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.amiya.pet.widgets
        MARKETING_VERSION: "1.9.3"
        CURRENT_PROJECT_VERSION: "213"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual
